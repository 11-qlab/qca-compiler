[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qca-compiler"
version = "0.1.0"
authors = [{name = "11-qlab"}]
description = "Compile QCA circuits to Qiskit using native Rz/Rx/CZ gates"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
keywords = ["quantum computing", "QCA", "compiler", "qiskit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy", "qiskit"]

[project.urls]
Homepage = "https://github.com/11-qlab/qca-compiler"

[project.scripts]
qca-compile = "qca_compiler.cli:main"
